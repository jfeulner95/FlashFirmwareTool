name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-build:
    name: C · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (make)
            os: ubuntu-latest
            build: make
            cc: gcc
            exe: c/fwtool
          - name: Linux Clang (make)
            os: ubuntu-latest
            build: make
            cc: clang
            exe: c/fwtool
          - name: Linux GCC (CMake)
            os: ubuntu-latest
            build: cmake
            exe: c/build/fwtool
          - name: macOS Clang (make)
            os: macos-latest
            build: make
            cc: clang
            exe: c/fwtool
          - name: Windows MSVC (CMake)
            os: windows-latest
            build: cmake
            exe: c/build/Release/fwtool.exe
    steps:
      - uses: actions/checkout@v7

      - name: Build with make
        if: matrix.build == 'make'
        working-directory: c
        run: make CC=${{ matrix.cc }}

      - name: Build with CMake
        if: matrix.build == 'cmake'
        working-directory: c
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Smoke test
        shell: bash
        run: bash c/tests/smoke_test.sh "${{ matrix.exe }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: fwtool-${{ matrix.os }}-${{ matrix.build }}${{ matrix.cc && format('-{0}', matrix.cc) || '' }}
          path: ${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 14

  python-tests:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt pytest

      - name: Install virtual display (Tk tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Byte-compile sources
        run: python -m compileall -q python

      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest python/tests -v

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest python/tests -v
